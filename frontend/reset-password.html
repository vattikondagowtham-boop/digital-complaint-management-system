<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-container">
            <h2>Set New Password</h2>
            <div id="reset-alert" class="alert"></div>
            <form id="reset-form">
                <div class="form-group">
                    <label>Reset Token</label>
                    <input type="text" id="reset-token" class="form-control" required placeholder="Paste token here">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="new-password" class="form-control" required
                        placeholder="Enter new password">
                </div>
                <button type="submit" class="btn" id="reset-btn">
                    <span class="btn-text">Update Password</span>
                    <div class="loader"></div>
                </button>
            </form>
            <div class="toggle-form" style="margin-top:20px;">
                <a href="login.html">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        // Always connect to backend on port 3000
        let API_BASE = 'http://localhost:3000';
        
        // If running on a different machine or external IP, adjust the host
        if (window.location.hostname && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            API_BASE = `${window.location.protocol.startsWith('http') ? window.location.protocol : 'http:'}//${window.location.hostname}:${window.location.port || '3000'}`;
        }
        if (!API_BASE || API_BASE.includes('://:')) {
            API_BASE = 'http://localhost:3000';
        }

        // Auto-fill token if sent via sessionStorage from formatting
        if (sessionStorage.getItem('temp_reset_token')) {
            document.getElementById('reset-token').value = sessionStorage.getItem('temp_reset_token');
            sessionStorage.removeItem('temp_reset_token');
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('reset-btn');
            btn.disabled = true;
            btn.querySelector('.loader').style.display = 'block';
            btn.querySelector('.btn-text').style.display = 'none';

            try {
                const res = await fetch(`${API_BASE}/api/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: document.getElementById('reset-token').value,
                        newPassword: document.getElementById('new-password').value
                    })
                });
                const data = await res.json();

                const alertEl = document.getElementById('reset-alert');
                alertEl.style.display = 'block';
                if (data.success) {
                    alertEl.className = 'alert alert-success';
                    alertEl.textContent = 'Password reset successfully! Redirecting...';
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    alertEl.className = 'alert alert-error';
                    alertEl.textContent = data.message;
                }
            } catch (err) {
                alert('Network error');
            } finally {
                btn.disabled = false;
                btn.querySelector('.loader').style.display = 'none';
                btn.querySelector('.btn-text').style.display = 'block';
            }
        });
    </script>
</body>

</html>
