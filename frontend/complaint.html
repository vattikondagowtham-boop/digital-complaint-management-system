<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-brand">📝 Complaint System</div>
        <div class="navbar-links">
            <span id="user-greeting" style="color: var(--text-muted); margin-right: 15px;"></span>
            <a href="#" onclick="logoutBtn(); return false;">Logout</a>
        </div>
    </nav>

    <div class="main-content">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
            <!-- Submit Form -->
            <div class="card">
                <h2 style="margin-bottom: 20px;">Submit a New Complaint</h2>
                <div id="submit-alert" class="alert"></div>

                <form id="complaintForm" onsubmit="submitComplaint(event)">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="title" class="form-control" required
                            placeholder="Brief title of the issue">
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="description" class="form-control" rows="4" required
                            placeholder="Detailed description of the problem"></textarea>
                    </div>

                    <div class="form-group" style="display: flex; gap: 15px;">
                        <div style="flex: 1;">
                            <label>Date of Complaint</label>
                            <input type="text" id="dateOfComplaint" class="form-control" readonly>
                        </div>
                        <div style="flex: 1;">
                            <label>Date of Incident</label>
                            <input type="date" id="dateOfIncident" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Category</label>
                        <select id="category" class="form-control" required>
                            <option value="Technical">Technical</option>
                            <option value="Billing">Billing</option>
                            <option value="Service">Service</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Location / Address</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="address" class="form-control" required
                                placeholder="Enter address or detect location">
                            <button type="button" class="btn btn-outline" style="width: auto; white-space: nowrap;"
                                onclick="getLocation()">
                                📍 Get Live Location
                            </button>
                        </div>
                    </div>

                    <input type="hidden" id="lat">
                    <input type="hidden" id="lng">

                    <div class="form-group">
                        <label>Upload Image (Camera Supported)</label>
                        <input type="file" id="image" accept="image/*" capture="environment" class="form-control">
                    </div>

                    <button type="submit" class="btn" id="submit-btn" style="margin-top: 10px;">
                        <span class="btn-text">Submit Complaint</span>
                        <div class="loader"></div>
                    </button>
                </form>
            </div>

            <!-- Live Tracking Panel -->
            <div class="card" id="tracking-panel" style="display: none; border-left: 4px solid var(--primary);">
                <h3 style="margin-bottom: 15px;">📡 Live Tracking</h3>
                <p style="font-size: 14px; margin-bottom: 15px; color: var(--text-muted);">
                    Tracking active for Complaint #<span id="tracked-complaint-id"></span>
                </p>
                <div
                    style="font-size: 15px; font-weight: bold; margin-bottom: 15px; background: var(--bg-color); padding: 10px; border-radius: 8px;">
                    Current Location: <br>
                    <span id="live-coords" style="color: var(--primary);">Not tracking</span>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-outline" id="start-track-btn" onclick="startManualTracking()">▶ Start
                        Tracking</button>
                    <button class="btn" id="stop-track-btn" style="background-color: var(--danger); display: none;"
                        onclick="stopManualTracking()">⏹ Stop Tracking</button>
                </div>
            </div>

            <!-- My Complaints List -->
            <div>
                <h2 style="margin-bottom: 20px;">My Recent Complaints</h2>
                <div id="my-complaints" class="complaints-grid" style="grid-template-columns: 1fr;">
                    <!-- Insert dynamically -->
                    <p style="color: var(--text-muted);">Loading complaints...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center;">
        <div
            style="background: var(--surface); width: 400px; max-width: 90%; border-radius: 12px; padding: 24px; text-align: center;">
            <div style="font-size: 40px; margin-bottom: 15px;">⚠️</div>
            <h3 style="margin-top: 0;">Are you sure?</h3>
            <p style="color: var(--text-muted); margin-bottom: 25px;">Are you sure you want to delete this complaint?
                This action cannot be undone.</p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="btn btn-outline" style="flex: 1;" onclick="closeDeleteModal()">Cancel</button>
                <button id="confirm-delete-btn" class="btn" style="flex: 1; background-color: var(--danger);"
                    onclick="executeDelete()">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script>
        // Always connect to backend on port 3000
        let API_BASE = 'http://localhost:3000';
        
        // If running on a different machine or external IP, adjust the host
        if (window.location.hostname && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            API_BASE = `${window.location.protocol.startsWith('http') ? window.location.protocol : 'http:'}//${window.location.hostname}:${window.location.port || '3000'}`;
        }
        if (!API_BASE || API_BASE.includes('://:')) {
            API_BASE = 'http://localhost:3000';
        }

        // Auth check
        const userStr = localStorage.getItem('user');
        if (!userStr) {
            window.location.href = 'index.html';
        }
        const user = JSON.parse(userStr);
        document.getElementById('user-greeting').textContent = 'Hello, ' + user.name;

        // Auto-fill dates
        const today = new Date();
        const todayStr = `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear()}`;
        document.getElementById('dateOfComplaint').value = todayStr;

        // Prevent future dates
        const offset = today.getTimezoneOffset();
        const maxDate = new Date(today.getTime() - (offset * 60 * 1000)).toISOString().split('T')[0];
        document.getElementById('dateOfIncident').max = maxDate;

        function logoutBtn() {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        function showAlert(id, message, isSuccess = false) {
            const el = document.getElementById(id);
            el.style.display = 'block';
            el.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
            el.textContent = message;
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        function setLoading(btnId, isLoading) {
            const btn = document.getElementById(btnId);
            const text = btn.querySelector('.btn-text');
            const loader = btn.querySelector('.loader');
            if (isLoading) {
                btn.disabled = true;
                text.style.display = 'none';
                loader.style.display = 'block';
            } else {
                btn.disabled = false;
                text.style.display = 'block';
                loader.style.display = 'none';
            }
        }

        // Live location logic
        async function getLocation() {
            if (navigator.geolocation) {
                const btn = document.querySelector('.btn-outline');
                const origText = btn.innerHTML;
                btn.innerHTML = 'Detecting...';
                btn.disabled = true;

                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    document.getElementById('lat').value = lat;
                    document.getElementById('lng').value = lng;

                    try {
                        // Reverse geocoding via Nominatim
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                        const data = await res.json();
                        if (data && data.display_name) {
                            document.getElementById('address').value = data.display_name;
                        } else {
                            document.getElementById('address').value = `${lat}, ${lng}`;
                        }
                    } catch (e) {
                        document.getElementById('address').value = `${lat}, ${lng}`;
                    }

                    btn.innerHTML = '📍 Location Found';
                    setTimeout(() => {
                        btn.innerHTML = origText;
                        btn.disabled = false;
                    }, 3000);
                }, (error) => {
                    alert('Error getting location: ' + error.message);
                    btn.innerHTML = origText;
                    btn.disabled = false;
                });
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }

        // Submit Complaint
        async function submitComplaint(e) {
            e.preventDefault();
            setLoading('submit-btn', true);

            const formData = new FormData();
            formData.append('user_id', user.id);
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('incident_date', document.getElementById('dateOfIncident').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('address', document.getElementById('address').value);
            formData.append('latitude', document.getElementById('lat').value || 0);
            formData.append('longitude', document.getElementById('lng').value || 0);

            const imageFile = document.getElementById('image').files[0];
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                const res = await fetch(`${API_BASE}/api/complaints`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    // Show Date and Time in Alert
                    const d = new Date();
                    const dStr = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
                    const tStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    showAlert('submit-alert', `Complaint submitted on ${dStr} at ${tStr}`, true);

                    document.getElementById('complaintForm').reset();
                    document.getElementById('dateOfComplaint').value = todayStr; // Keep it populated after reset
                    document.getElementById('lat').value = '';
                    document.getElementById('lng').value = '';
                    fetchMyComplaints();

                    // Setup manual tracking logic panel
                    document.getElementById('tracking-panel').style.display = 'block';
                    document.getElementById('tracked-complaint-id').textContent = data.complaintId;
                    window.currentTrackedComplaintId = data.complaintId;
                    startManualTracking(); // Auto-start tracking on submit
                } else {
                    showAlert('submit-alert', data.message);
                }
            } catch (err) {
                showAlert('submit-alert', 'Network error while submitting.');
            } finally {
                setLoading('submit-btn', false);
            }
        }

        // Fetch user's complaints
        async function fetchMyComplaints() {
            try {
                const res = await fetch(`${API_BASE}/api/my-complaints?user_id=${user.id}`);
                const data = await res.json();
                const container = document.getElementById('my-complaints');

                if (data.success && data.complaints.length > 0) {
                    container.innerHTML = data.complaints.map(c => `
                        <div class="complaint-card" style="margin-bottom: 15px;">
                            ${c.image ? `<img src="${c.image}" class="complaint-img" style="height: 120px;">` : ''}
                            <div class="complaint-body" style="padding: 15px;">
                                <div class="complaint-header">
                                    <div class="complaint-title" style="font-size: 16px;">${c.title}</div>
                                    <span class="badge ${getStatusClass(c.status)}">${c.status}</span>
                                </div>
                                <div class="complaint-meta">📍 ${c.address}</div>
                                <button class="btn btn-outline" style="color: var(--danger); border-color: var(--danger); margin-top: 15px; width: 100%; justify-content: center;" onclick="confirmDelete(${c.id}, '${c.status}')">🗑️ Delete Complaint</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p style="color: var(--text-muted);">No complaints submitted yet.</p>';
                }
            } catch (e) {
                console.error('Error fetching complaints:', e);
            }
        }

        function getStatusClass(status) {
            if (status.toLowerCase().includes('pending')) return 'badge-pending';
            if (status.toLowerCase().includes('progress')) return 'badge-progress';
            if (status.toLowerCase().includes('resolved')) return 'badge-resolved';
            return 'badge-pending';
        }

        // Deletion Methods
        let currentDeleteId = null;

        function confirmDelete(id, status) {
            if (status !== 'Pending') {
                return alert("This complaint cannot be deleted as it is already being processed.");
            }
            currentDeleteId = id;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
            currentDeleteId = null;
        }

        async function executeDelete() {
            if (!currentDeleteId) return;
            const btn = document.getElementById('confirm-delete-btn');
            btn.innerHTML = 'Deleting...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/complaints/${currentDeleteId}`, {
                    method: 'DELETE',
                    headers: { 'user-id': user.id }
                });
                const data = await res.json();

                if (data.success) {
                    showAlert('submit-alert', data.message, true);
                    fetchMyComplaints();
                    // If tracking active complaint
                    if (window.currentTrackedComplaintId == currentDeleteId) {
                        stopManualTracking();
                        document.getElementById('tracking-panel').style.display = 'none';
                    }
                } else {
                    showAlert('submit-alert', data.message);
                }
            } catch (err) {
                showAlert('submit-alert', 'Network error during deletion.');
            } finally {
                closeDeleteModal();
                btn.innerHTML = 'Yes, Delete';
                btn.disabled = false;
            }
        }

        // Real-time tracking logic with Start/Stop buttons & interval
        let watchId = null;
        let lastBackendUpdate = 0;

        function startManualTracking() {
            const complaintId = window.currentTrackedComplaintId;
            if (!complaintId) return alert('Submit a complaint first to track it.');

            if (navigator.geolocation) {
                document.getElementById('start-track-btn').style.display = 'none';
                document.getElementById('stop-track-btn').style.display = 'block';
                document.getElementById('live-coords').textContent = 'Connecting to GPS...';

                watchId = navigator.geolocation.watchPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    document.getElementById('live-coords').textContent = `Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)}`;

                    const now = Date.now();
                    // Throttle to 10 seconds (10000 ms)
                    if (now - lastBackendUpdate >= 10000) {
                        try {
                            await fetch(`${API_BASE}/api/update-location`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    complaint_id: complaintId,
                                    latitude: lat,
                                    longitude: lng
                                })
                            });
                            lastBackendUpdate = now;
                        } catch (e) {
                            console.error('Failed to update tracking location');
                        }
                    }
                }, (error) => {
                    document.getElementById('live-coords').textContent = "Error: " + error.message;
                    stopManualTracking();
                }, { enableHighAccuracy: true });
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }

        function stopManualTracking() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            watchId = null;
            document.getElementById('start-track-btn').style.display = 'block';
            document.getElementById('stop-track-btn').style.display = 'none';
            document.getElementById('live-coords').textContent = 'Tracking stopped.';
        }

        // Initial fetch
        fetchMyComplaints();
    </script>
</body>

</html>
