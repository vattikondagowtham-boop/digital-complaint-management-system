<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-container">
            <h2>Recover Password</h2>
            <div id="forgot-alert" class="alert"></div>
            <form id="forgot-form">
                <div class="form-group">
                    <label>Enter Registered Email</label>
                    <input type="email" id="forgot-email" class="form-control" required placeholder="email@example.com">
                </div>
                <button type="submit" class="btn" id="forgot-btn">
                    <span class="btn-text">Send Reset Link</span>
                    <div class="loader"></div>
                </button>
            </form>
            <div class="toggle-form" style="margin-top:20px;">
                <a href="login.html">← Back to Login</a>
            </div>

            <!-- Dev Helper for the Token -->
            <div id="token-helper"
                style="display:none; margin-top:20px; padding:15px; background: rgba(16, 185, 129, 0.1); border: 1px dashed var(--success); border-radius:8px; font-size:12px; color:var(--success); word-break: break-all;">
                <strong>Simulation Note:</strong><br>
                In a real app, this token would be emailed to you. For this demo, copy the token below:<br><br>
                <span id="dev-token" style="font-family: monospace; font-size:14px; color:#fff;"></span>
                <br><br>
                <a href="reset-password.html" class="btn btn-outline btn-sm"
                    style="display:block; text-align:center;">Go to Reset Page</a>
            </div>

        </div>
    </div>

    <script>
        // Always connect to backend on port 3000
        let API_BASE = 'http://localhost:3000';
        
        // If running on a different machine or external IP, adjust the host
        if (window.location.hostname && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            API_BASE = `${window.location.protocol.startsWith('http') ? window.location.protocol : 'http:'}//${window.location.hostname}:${window.location.port || '3000'}`;
        }
        if (!API_BASE || API_BASE.includes('://:')) {
            API_BASE = 'http://localhost:3000';
        }

        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('forgot-btn');
            btn.disabled = true;
            btn.querySelector('.loader').style.display = 'block';
            btn.querySelector('.btn-text').style.display = 'none';

            try {
                const res = await fetch(`${API_BASE}/api/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('forgot-email').value
                    })
                });
                const data = await res.json();

                const alertEl = document.getElementById('forgot-alert');
                alertEl.style.display = 'block';
                if (data.success) {
                    alertEl.className = 'alert alert-success';
                    alertEl.textContent = 'Token generated successfully!';

                    document.getElementById('token-helper').style.display = 'block';
                    document.getElementById('dev-token').textContent = data.token;

                    // store temporarily for the UX
                    sessionStorage.setItem('temp_reset_token', data.token);
                } else {
                    alertEl.className = 'alert alert-error';
                    alertEl.textContent = data.message;
                }
            } catch (err) {
                alert('Network error');
            } finally {
                btn.disabled = false;
                btn.querySelector('.loader').style.display = 'none';
                btn.querySelector('.btn-text').style.display = 'block';
            }
        });
    </script>
</body>

</html>
