<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Complaint System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-container">
            <h2>Create Account</h2>
            <div id="register-alert" class="alert"></div>
            <form id="register-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" class="form-control" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" class="form-control" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" class="form-control" required
                        placeholder="Create a password">
                </div>
                <button type="submit" class="btn" id="reg-btn">
                    <span class="btn-text">Register</span>
                    <div class="loader"></div>
                </button>
            </form>
            <div class="toggle-form">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>
    <script>
        // Always connect to backend on port 3000
        let API_BASE = 'http://localhost:3000';
        
        // If running on a different machine or external IP, adjust the host
        if (window.location.hostname && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            API_BASE = `${window.location.protocol.startsWith('http') ? window.location.protocol : 'http:'}//${window.location.hostname}:${window.location.port || '3000'}`;
        }
        if (!API_BASE || API_BASE.includes('://:')) {
            API_BASE = 'http://localhost:3000';
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('reg-btn');
            btn.disabled = true;
            btn.querySelector('.loader').style.display = 'block';
            btn.querySelector('.btn-text').style.display = 'none';

            try {
                const res = await fetch(`${API_BASE}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('reg-name').value,
                        email: document.getElementById('reg-email').value,
                        password: document.getElementById('reg-password').value
                    })
                });
                const data = await res.json();

                const alertEl = document.getElementById('register-alert');
                alertEl.style.display = 'block';
                if (data.success) {
                    alertEl.className = 'alert alert-success';
                    alertEl.textContent = 'Account created successfully! Redirecting...';
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    alertEl.className = 'alert alert-error';
                    alertEl.textContent = data.message;
                }
            } catch (err) {
                alert('Network error');
            } finally {
                btn.disabled = false;
                btn.querySelector('.loader').style.display = 'none';
                btn.querySelector('.btn-text').style.display = 'block';
            }
        });
    </script>
</body>

</html>
